name: CI

on:
  push:
    branches: [azimiocustomers-dev, '2.1']
  pull_request:
  # Lets deploy.yml reuse this job, so a deploy cannot skip the suite.
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the ceiling, not a choice: sabberworm/php-css-parser (dompdf,
        # used for quote PDFs) declares no support above 8.4, so the locked
        # tree will not install under 8.5. Production runs 8.4 for the same
        # reason — see /etc/php/8.4/fpm/pool.d/clients.conf on az1.
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: azimio_crm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip, bcmath
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_ENV=.*|APP_ENV=testing|"            .env
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|"          .env
          sed -i "s|^DB_PORT=.*|DB_PORT=3306|"               .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=azimio_crm_test|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=root|"       .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=root|"       .env
          php artisan key:generate

      - name: Install the application
        run: php artisan krayin-crm:install --skip-env-check --skip-admin-creation

      - name: Seed tenant fixtures
        # The feature suite is written against the dev tenants
        # (twiga-traders, kilimanjaro-suppliers) and their admin users. The
        # tests fail at the first firstOrFail() without these.
        run: php artisan db:seed --class="Azimio\Tenancy\Database\Seeders\DevTenantSeeder"

      - name: Run tests
        # Deliberately NOT --parallel. Several suites reset state across
        # every tenant in afterEach (for example sms_credits), so parallel
        # workers would clobber each other's fixtures and fail at random.
        run: vendor/bin/pest --colors=always
